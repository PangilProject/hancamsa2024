    <main class="page">
        <div class="container container--narrow">
            <header class="page-head">
                <p class="page-eyebrow">핫플레이스</p>
                <h1 class="page-title">{{ h.title }}</h1>
            </header>

            <div class="detail">
                <div class="detail__gallery">
{% for img in h.images %}                    <figure class="detail__photo">
                        <img src="{{ base }}{{ img }}" alt="{{ h.title }}" loading="lazy">
                    </figure>
{% endfor %}                </div>

                <div class="detail__body">
                    <div class="card">
{% for line in h.body %}                        <p class="body-text">{{ line }}</p>
{% endfor %}                    </div>
{% if h.extra_heading %}                    <div class="card callout">
                        <h2 class="callout__title">{{ h.extra_heading }}</h2>
{% for line in h.extra_lines %}                        <p class="body-text">{{ line }}</p>
{% endfor %}                    </div>
{% endif %}                </div>
            </div>
        </div>
    </main>
