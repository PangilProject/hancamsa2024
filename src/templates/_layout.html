<!DOCTYPE html>
<html lang="{{ site.lang }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="{{ base }}image/HGU_logo.webp">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <link href="{{ base }}css/base.css" rel="stylesheet">
{% for css in styles %}    <link href="{{ css }}" rel="stylesheet">
{% endfor %}
    <!-- 반응형 (항상 마지막) -->
    <link href="{{ base }}css/responsive.css" rel="stylesheet">
</head>

<body class="{{ body_class }}">
{% if chrome %}{% include "_nav.html" %}
{% endif %}{{& content }}
{% if chrome %}{% include "_footer.html" %}
{% endif %}{% for js in scripts %}    <script src="{{ js }}"></script>
{% endfor %}</body>

</html>
