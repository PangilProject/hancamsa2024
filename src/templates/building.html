    <header class="detail-hero">
        <img src="{{ base }}{{ b.bg }}" alt="{{ b.name }} 전경">
        <div class="detail-hero__scrim"></div>
        <div class="detail-hero__content container">
            <p class="detail-hero__eyebrow">건물 소개</p>
            <h1 class="detail-hero__title">{{ b.name }}</h1>
        </div>
    </header>

    <main class="page">
        <div class="container">
{% include "_tabs.html" %}

            <section class="section" id="section_3">
                <div class="card split">
                    <div class="split__text">
                        <h2 class="section-title">이곳은 어떤 곳인가요?</h2>
                        <p class="body-text">{{ b.desc }}</p>
                    </div>
                    <div class="split__media">
                        <img src="{{ base }}{{ b.photo }}" alt="{{ b.name }}" loading="lazy">
                    </div>
                </div>
            </section>

            <section class="section" id="section_2">
                <h2 class="section-title">핫플레이스</h2>
                <p class="section-desc">{{ b.name }} 안에서 꼭 가볼 만한 곳이에요.</p>
                <div class="place-grid">
{% for c in b.hotplaces %}                    <a class="place-card" href="info/{{ c.slug }}.html">
                        <div class="place-card__media">
                            <img src="{{ base }}{{ c.image }}" alt="{{ c.label }}" loading="lazy">
                        </div>
                        <p class="place-card__label">{{ c.label }}</p>
                    </a>
{% endfor %}                </div>
            </section>
        </div>
    </main>
