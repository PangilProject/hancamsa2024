    <section class="hero">
        <div class="hero__media" id="carousel">
{% for s in slides %}            <figure class="hero__slide">
                <img src="{{ base }}{{ s.image }}" alt="{{ s.alt }}">
            </figure>
{% endfor %}            <div class="hero__dots" role="tablist" aria-label="배경 사진 전환">
{% for s in slides %}                <button type="button" class="hero__dot" data-index="{{ loop.index0 }}" aria-label="{{ loop.index }}번째 사진"></button>
{% endfor %}            </div>
        </div>

        <div class="hero__content">
            <p class="hero__eyebrow">{{ site.tagline }}</p>
            <h1 class="hero__title">{{& welcome }}</h1>
            <div class="hero__actions">
                <a class="btn btn--primary" href="campusMap.html">캠퍼스맵 보기</a>
                <a class="btn btn--ghost" href="introduce.html">한캠사 소개</a>
            </div>
        </div>
    </section>
